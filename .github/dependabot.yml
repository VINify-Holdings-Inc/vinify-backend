version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      security-patches:
        applies-to: security-updates
        update-types:
          - "patch"
          - "minor"
      routine-patches:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
    # Major-version bumps (security or routine) are intentionally left out of
    # the groups above, so each opens as its own PR for individual review --
    # they carry real breaking-change risk (see e.g. typeorm 0.3->1.0,
    # express 4->5).
