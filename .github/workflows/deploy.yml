name: Deploy to production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "ecosystem.config.js"
      - "deploy/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          ASG_INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names production-asg \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          INSTANCE_IDS="i-065704b19bce21f09 $ASG_INSTANCE_IDS"
          echo "Deploying to: $INSTANCE_IDS"

          PARAMS=$(jq -n --rawfile script deploy/remote-deploy.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "vinify-backend deploy from ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --output text --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          FAILED=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" || true

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json > "invocation-$INSTANCE_ID.json"

            echo "=== $INSTANCE_ID ==="
            cat "invocation-$INSTANCE_ID.json"

            STATUS=$(python3 -c "import json;print(json.load(open('invocation-$INSTANCE_ID.json'))['Status'])")
            if [ "$STATUS" != "Success" ]; then
              echo "Deploy failed on $INSTANCE_ID with status: $STATUS"
              FAILED=1
            fi
          done

          if [ "$FAILED" != "0" ]; then
            exit 1
          fi
