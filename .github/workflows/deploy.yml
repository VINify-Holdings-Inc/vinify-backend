name: Deploy to production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          PARAMS=$(jq -n --rawfile script deploy/remote-deploy.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-065704b19bce21f09" \
            --document-name "AWS-RunShellScript" \
            --comment "vinify-backend deploy from ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --output text --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-065704b19bce21f09" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-065704b19bce21f09" \
            --output json > invocation.json

          cat invocation.json

          STATUS=$(python3 -c "import json;print(json.load(open('invocation.json'))['Status'])")
          if [ "$STATUS" != "Success" ]; then
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi
