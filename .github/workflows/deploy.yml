name: Deploy to production

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "ecosystem.config.js"
      - "deploy/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy via SSM
        run: |
          ASG_INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names production-asg \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)

          INSTANCE_IDS="$ASG_INSTANCE_IDS"
          echo "Deploying to: $INSTANCE_IDS"

          PARAMS=$(jq -n --rawfile script deploy/remote-deploy.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_IDS \
            --document-name "AWS-RunShellScript" \
            --comment "vinify-backend deploy from ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --output text --query "Command.CommandId")

          echo "SSM Command ID: $COMMAND_ID"

          FAILED=0
          for INSTANCE_ID in $INSTANCE_IDS; do
            # `aws ssm wait command-executed` gives up after ~100s, but a real
            # deploy (npm install + ts-node cold start + health check) runs for
            # several minutes -- it was reporting InProgress on deploys that were
            # still legitimately running. Poll for a terminal state instead.
            for _ in $(seq 1 90); do
              STATE=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' --output text 2>/dev/null || echo Pending)
              case "$STATE" in
                Success|Failed|Cancelled|TimedOut) break ;;
              esac
              sleep 10
            done

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json > "invocation-$INSTANCE_ID.json"

            echo "=== $INSTANCE_ID ==="
            cat "invocation-$INSTANCE_ID.json"

            STATUS=$(python3 -c "import json;print(json.load(open('invocation-$INSTANCE_ID.json'))['Status'])")
            if [ "$STATUS" != "Success" ]; then
              echo "Deploy failed on $INSTANCE_ID with status: $STATUS"
              FAILED=1
            fi
          done

          if [ "$FAILED" != "0" ]; then
            exit 1
          fi

      - name: Deploy to ingestion worker
        run: |
          # The AAMVA SFTP jobs run on a dedicated worker outside the ASG (it needs a
          # public subnet to reach outbound port 22), so it is targeted by tag. This
          # runs after the production instances above have finished, so a problem
          # here can fail the job but never blocks a production deploy.
          PARAMS=$(jq -n --rawfile script deploy/remote-deploy.sh '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --targets "Key=tag:Role,Values=ingestion-worker" \
            --document-name "AWS-RunShellScript" \
            --comment "vinify-backend deploy (ingestion worker) from ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --output text --query "Command.CommandId")
          echo "SSM Command ID: $COMMAND_ID"

          # send-command reports TargetCount 0 for tag targets even when the command
          # is delivered, so wait for real invocations instead of trusting it.
          for i in $(seq 1 90); do
            COUNT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
              --query "length(CommandInvocations)" --output text)
            IN_FLIGHT=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" \
              --query "length(CommandInvocations[?Status=='Pending' || Status=='InProgress' || Status=='Delayed'])" \
              --output text)
            if [ "$COUNT" -gt 0 ] && [ "$IN_FLIGHT" = "0" ]; then
              break
            fi
            if [ "$COUNT" = "0" ] && [ "$i" -ge 6 ]; then
              echo "::warning::No instance tagged Role=ingestion-worker picked up the deploy; worker not deployed."
              exit 0
            fi
            sleep 10
          done

          aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --output json > worker-invocations.json
          python3 -c "import json,sys; inv=json.load(open('worker-invocations.json'))['CommandInvocations']; [print(i['InstanceId'], i['Status']) for i in inv]; sys.exit(0 if inv and all(i['Status']=='Success' for i in inv) else 1)"
